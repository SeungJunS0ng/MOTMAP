spring:
  application:
    name: MOTMAP

  # 데이터베이스 설정 (클라우드 환경 자동 감지 / H2 인메모리 기본 폴백)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:motmapdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: ${SPRING_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Thymeleaf 설정
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

  # Spring MVC 설정 (favicon 비활성화)
  mvc:
    favicon:
      enabled: false
  web:
    resources:
      add-mappings: true

# 서버 포트 설정
server:
  port: ${PORT:8080}

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    display-operation-id: true

# 로깅 설정
logging:
  level:
    com.motmap: debug
    org.springframework.web: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/motmap.log

# JWT 설정
jwt:
  secret: motmap-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000  # 24시간 (밀리초)
